name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-flight runs for same branch on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────
# FRONTEND JOB
# ────────────────────────────────────────────────
jobs:
  frontend-ci:
    name: "🎨 Frontend — Lint, Type-check & Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint (oxlint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type-check (tsc)
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build production bundle
        working-directory: ./frontend
        run: npm run build
        env:
          # Vite will bake this into the bundle for API calls
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL || 'http://localhost:8000' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ────────────────────────────────────────────────
  # BACKEND JOB
  # ────────────────────────────────────────────────
  backend-ci:
    name: "🐍 Backend — Lint, Test & Import-check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        working-directory: ./backend
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            --exclude=.venv,__pycache__,*.pyc

      - name: Import smoke-test (verifies all modules load)
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "mock"
          AI_PROVIDER: "local"
          EMBEDDING_MODEL: "all-mpnet-base-v2"
        run: python -c "from app.main import app; print('✅ All imports OK')"

      - name: Run tests with pytest (SQLite in-memory)
        working-directory: ./backend
        env:
          TEST_DATABASE_URL: "sqlite:///:memory:"
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: "mock"
          AI_PROVIDER: "local"
          EMBEDDING_MODEL: "all-mpnet-base-v2"
        run: |
          pytest tests/ -v \
            --tb=short \
            --ignore=tests/e2e \
            --ignore=tests/load \
            -x

  # ────────────────────────────────────────────────
  # AI MODULE JOB
  # ────────────────────────────────────────────────
  ai-ci:
    name: "🤖 AI Module — Import & Baseline Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt

      - name: Install AI dependencies
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: AI config smoke-test
        working-directory: ./ai
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: "local"
          EMBEDDING_MODEL: "all-mpnet-base-v2"
        run: |
          python -c "
          from config import ai_config
          print(f'✅ AI config loaded — provider: {ai_config.AI_PROVIDER}')
          "

      - name: AI API smoke-test
        working-directory: ./ai
        env:
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: "local"
          EMBEDDING_MODEL: "all-mpnet-base-v2"
        run: |
          python -c "
          from api import app
          print('✅ AI FastAPI app loaded OK')
          "

      - name: Baseline module import check
        working-directory: ./ai
        run: |
          python -c "
          from baseline.baseline_matcher import BaslineMatcher if __import__('importlib.util', fromlist=['util']).util.find_spec('baseline.baseline_matcher') else None
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('bm', 'baseline/baseline_matcher.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print('✅ Baseline matcher module loaded OK')
          "

  # ────────────────────────────────────────────────
  # SECURITY SCAN JOB
  # ────────────────────────────────────────────────
  security-scan:
    name: "🔒 Security — Bandit & npm audit"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security tools
        run: pip install bandit

      - name: Run Bandit (Python security linter)
        run: |
          bandit -r backend/app/ \
            -ll \
            --exclude backend/app/__pycache__ \
            -f txt \
            || true   # Report findings but don't fail CI for now

      - name: Setup Node.js for npm audit
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend dependencies)
        working-directory: ./frontend
        run: npm audit --audit-level=high || true   # Report high+ vulns, warn only

  # ────────────────────────────────────────────────
  # SUMMARY JOB — gating all others
  # ────────────────────────────────────────────────
  ci-success:
    name: "✅ All CI Jobs Passed"
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, ai-ci, security-scan]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.frontend-ci.result }}" != "success" ]]; then
            echo "❌ Frontend CI failed" && exit 1
          fi
          if [[ "${{ needs.backend-ci.result }}" != "success" ]]; then
            echo "❌ Backend CI failed" && exit 1
          fi
          if [[ "${{ needs.ai-ci.result }}" != "success" ]]; then
            echo "❌ AI CI failed" && exit 1
          fi
          echo "✅ All CI checks passed!"
