name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
# FRONTEND — Lint, Type-check & Build
# ─────────────────────────────────────────────────────────────
jobs:
  frontend-ci:
    name: "🎨 Frontend — Lint, Type-check & Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Type-check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: "http://localhost:8000"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # BACKEND — Lint, Import-check & Pytest
  # ─────────────────────────────────────────────────────────────
  backend-ci:
    name: "🐍 Backend — Lint, Import-check & Pytest"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Use Python 3.12 — matches the project's bleeding-edge deps better than 3.11
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install flake8

      - name: Lint — flake8 (syntax errors + undefined names)
        working-directory: ./backend
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.venv,__pycache__,*.pyc

      - name: Smoke-test — app imports cleanly
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
          TEST_DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret-key-32-chars-long!!"
          LLM_PROVIDER: "mock"
          AI_PROVIDER: "local"
          EMBEDDING_MODEL: "all-mpnet-base-v2"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: "true"
          PYTHONPATH: "."
        run: |
          python -c "
          import sys, os
          from unittest.mock import MagicMock
          for mod in ['sentence_transformers', 'torch', 'transformers']:
              sys.modules.setdefault(mod, MagicMock())
          from app.main import app
          print('✅ app.main imported successfully')
          "

      - name: Run pytest (SQLite in-memory, ML libs mocked)
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          TEST_DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          JWT_SECRET: "ci-test-secret-key-32-chars-long!!"
          LLM_PROVIDER: "mock"
          AI_PROVIDER: "local"
          EMBEDDING_MODEL: "all-mpnet-base-v2"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: "true"
          PYTHONPATH: "."
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --ignore=tests/e2e \
            --ignore=tests/load \
            --asyncio-mode=strict \
            -W ignore::DeprecationWarning \
            -q

  # ─────────────────────────────────────────────────────────────
  # AI MODULE — Config, API & Baseline Tests
  # ─────────────────────────────────────────────────────────────
  ai-ci:
    name: "🤖 AI Module — Config, API & Baseline Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt

      - name: Install AI dependencies
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test 1 — AI config loads
        working-directory: ./ai
        env:
          AI_PROVIDER: "local"
          EMBEDDING_MODEL: "all-mpnet-base-v2"
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          from config import ai_config
          print(f'✅ AI config OK — provider={ai_config.AI_PROVIDER}')
          "

      - name: Test 2 — AI FastAPI app loads
        working-directory: ./ai
        env:
          AI_PROVIDER: "local"
          EMBEDDING_MODEL: "all-mpnet-base-v2"
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          from api import app
          routes = [r.path for r in app.routes]
          assert '/health' in routes
          print(f'✅ AI app loaded — routes: {routes}')
          "

      - name: Test 3 — Baseline matcher correctness
        working-directory: ./ai
        run: |
          python -c "
          from baseline.baseline_matcher import BaselineMatcher

          m = BaselineMatcher(match_threshold=0.8)

          r = m.predict('gate valve 2 inch flanged', 'gate valve 2 inch flanged')
          assert r['is_match'], f'Identical strings must match: {r}'
          print(f'✅ Identical match  score={r[\"score\"]:.3f}')

          r2 = m.predict('bearing SKF 6202 deep groove', 'butterfly valve PN16 300mm')
          assert not r2['is_match'], f'Different items must not match: {r2}'
          print(f'✅ Different no-match  score={r2[\"score\"]:.3f}')

          print('✅ Baseline matcher tests passed')
          "

  # ─────────────────────────────────────────────────────────────
  # SECURITY — Bandit + npm audit
  # ─────────────────────────────────────────────────────────────
  security-scan:
    name: "🔒 Security — Bandit & npm audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Bandit security scan
        run: |
          bandit -r backend/app/ -ll \
            --exclude backend/app/__pycache__ \
            -f txt || true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

  # ─────────────────────────────────────────────────────────────
  # GATE — all must pass
  # ─────────────────────────────────────────────────────────────
  ci-success:
    name: "✅ All CI Jobs Passed"
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, ai-ci, security-scan]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "frontend-ci:   ${{ needs.frontend-ci.result }}"
          echo "backend-ci:    ${{ needs.backend-ci.result }}"
          echo "ai-ci:         ${{ needs.ai-ci.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"
          if [[ "${{ needs.frontend-ci.result }}"  != "success" ]]; then echo "❌ frontend-ci failed"  && exit 1; fi
          if [[ "${{ needs.backend-ci.result }}"   != "success" ]]; then echo "❌ backend-ci failed"   && exit 1; fi
          if [[ "${{ needs.ai-ci.result }}"        != "success" ]]; then echo "❌ ai-ci failed"        && exit 1; fi
          echo "✅ All checks passed — platform is healthy!"
